[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "annual-report-harvester"
version = "0.1.0"
description = "SOP-compliant, concurrent PDF collection for US and UK annual reports"
requires-python = ">=3.11"
dependencies = ["curl_cffi>=0.11,<1", "PyMuPDF>=1.25,<2", "httpx>=0.27,<1", "rich>=13,<15", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
render = ["playwright>=1.50,<2"]

[project.scripts]
ar-harvest = "annual_reports.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
